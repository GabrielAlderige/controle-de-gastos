# Pipeline de CI/CD do Controle de Gastos.
#
#   CI (integração contínua): a cada push e pull request, uma máquina limpa do
#   GitHub baixa o código e prova que ele funciona: lint, tipos, testes
#   unitários com cobertura e testes de interface num navegador de verdade.
#
#   CD (entrega contínua): se TUDO passou e o push foi na main, o site é
#   construído e publicado no GitHub Pages sozinho. Código quebrado nunca
#   chega no ar, porque o deploy depende ("needs") dos testes.
#
#   push/PR ─► qualidade ─┬─► interface ─┐
#                         └─► unitarios ─┴─► deploy (só na main)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # botão "Run workflow" na aba Actions

# um push novo na mesma branch cancela a rodada antiga, que já ficou velha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unitarios:
    name: Testes unitários (Vitest)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # falha se a cobertura cair abaixo do mínimo do vite.config.ts
      - run: npm run test:coverage
      - name: Guarda o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  interface:
    name: Testes de interface (Playwright)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Instala o Chromium
        run: npx playwright install --with-deps chromium
      # o playwright.config.ts constrói o site e sobe o servidor sozinho
      - run: npm run e2e
      - name: Guarda o relatório (prints, vídeo e rastro do erro)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorio-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Publica no GitHub Pages
    needs: [unitarios, interface]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publicar no Pages
      id-token: write # provar ao Pages que o pedido vem deste repositório
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: publicar
        uses: actions/deploy-pages@v5
